[project]
name = "agent-comm"
version = "0.1.0"
description = "Local messaging hub for cross-harness AI agent communication"
readme = "README.md"
authors = [
    { name = "k3nopa", email = "afiqnaufalpro@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
agent-comm = "agent_comm.cli.main:cli"

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
